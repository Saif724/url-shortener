services:

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile

    ports:
      - "8080:8080"

    depends_on:
      redis:
        condition: service_healthy

    env_file:
      - .env